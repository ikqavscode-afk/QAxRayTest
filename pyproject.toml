[project]
name = "qaxraytest"
version = "0.1.0"
description = "Безопасная платформа базовых проверок сайтов и API"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "requests>=2.32", "flask>=3.0", "selenium>=4.20"]
[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "responses", "types-requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "live: проверки по настоящим адресам; выключены, включаются через QAXRAY_LIVE=1",
  "browser: тесты с настоящим Chrome; выключены, включаются через QAXRAY_BROWSER=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
