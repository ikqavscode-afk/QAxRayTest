name: Browser tests

# Отдельное задание: нужен Chrome и доступ к открытым сайтам, поэтому оно не входит в быстрый CI
# и его сбой не блокирует остальные проверки. Запуск: вручную, раз в неделю и при изменении
# браузерного кода.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main]
    paths:
      - "app/adapters/browser/**"
      - "app/core/browser*.py"
      - "tests/browser/**"
      - ".github/workflows/browser.yml"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Версия Chrome
        run: google-chrome --version
      - name: Браузерные тесты
        env:
          QAXRAY_BROWSER: "1"
          # Одноразовая виртуальная машина: песочница Chrome в ней недоступна.
          QAXRAY_BROWSER_NO_SANDBOX: "1"
        run: python -m pytest tests/browser -v
